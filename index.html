<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBLX VOID — Скрипты для Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Exo+2:wght@200;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --void:#00000c;
  --cyan:#00f5ff;
  --violet:#8b5cf6;
  --magenta:#f472b6;
  --green:#39ff14;
  --gold:#fbbf24;
  --tg:#29b6f6;
  --surface:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.07);
}
html{scroll-behavior:smooth;}
body{background:var(--void);color:#e8f0ff;font-family:'Exo 2',sans-serif;overflow-x:hidden;cursor:none;}

/* CUSTOM CURSOR */
#cur{position:fixed;width:10px;height:10px;background:var(--cyan);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 15px var(--cyan),0 0 30px var(--cyan);transition:width .2s,height .2s,background .2s;}
#cur-r{position:fixed;width:36px;height:36px;border:1px solid rgba(0,245,255,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .08s ease,top .08s ease;}
body:has(button:hover) #cur,body:has(a:hover) #cur{width:18px;height:18px;background:var(--magenta);box-shadow:0 0 20px var(--magenta);}

/* COSMIC BG */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 15% 25%,rgba(139,92,246,.15) 0%,transparent 60%),
    radial-gradient(ellipse 60% 70% at 85% 75%,rgba(0,245,255,.1) 0%,transparent 55%),
    radial-gradient(ellipse 90% 40% at 50% 110%,rgba(244,114,182,.1) 0%,transparent 50%),
    radial-gradient(ellipse 40% 60% at 70% 10%,rgba(57,255,20,.05) 0%,transparent 50%);
  animation:nebDrift 18s ease-in-out infinite alternate;}
@keyframes nebDrift{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.06)}}

/* AURORA */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora::before{content:'';position:absolute;top:-40%;left:-20%;width:140%;height:80%;
  background:linear-gradient(135deg,transparent 30%,rgba(0,245,255,.04) 50%,rgba(139,92,246,.06) 65%,transparent 80%);
  animation:auroraSpin 25s linear infinite;transform-origin:center;}
.aurora::after{content:'';position:absolute;top:30%;left:-10%;width:120%;height:70%;
  background:linear-gradient(135deg,transparent 20%,rgba(244,114,182,.03) 45%,rgba(57,255,20,.03) 65%,transparent 85%);
  animation:auroraSpin 35s linear infinite reverse;transform-origin:center;}
@keyframes auroraSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* GRID LINES */
.grid-lines{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,245,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.025) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 40%,transparent 100%);}

/* ── NAV ──────────────────────────────────────────────────────── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:.85rem 2rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  background:rgba(0,0,12,.88);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(0,245,255,.1);
  box-shadow:0 0 40px rgba(0,245,255,.05);}
.logo{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:900;letter-spacing:.35em;
  background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-decoration:none;cursor:none;flex-shrink:0;
  filter:drop-shadow(0 0 8px rgba(0,245,255,.4));}
.nav-links{display:flex;gap:1.5rem;list-style:none;}
.nav-links a{font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:.25em;text-transform:uppercase;
  text-decoration:none;color:rgba(232,240,255,.4);transition:color .3s;cursor:none;}
.nav-links a:hover{color:var(--cyan);}

/* NAV RIGHT */
.nav-right{display:flex;align-items:center;gap:.55rem;flex-shrink:0;}

/* ALL NAV PILLS */
.npill{font-family:'Orbitron',sans-serif;font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 13px;border-radius:50px;text-decoration:none;cursor:none;border:none;
  transition:all .25s;white-space:nowrap;line-height:1;}
.npill-tg{background:rgba(41,182,246,.12);color:var(--tg);border:1px solid rgba(41,182,246,.3);}
.npill-tg:hover{background:rgba(41,182,246,.25);box-shadow:0 0 18px rgba(41,182,246,.4);transform:translateY(-1px);}
.npill-ftap{background:rgba(57,255,20,.08);color:var(--green);border:1px solid rgba(57,255,20,.25);}
.npill-ftap:hover{background:rgba(57,255,20,.2);box-shadow:0 0 18px rgba(57,255,20,.35);transform:translateY(-1px);}
.npill-faq{background:linear-gradient(135deg,rgba(0,245,255,.15),rgba(139,92,246,.15));color:var(--cyan);border:1px solid rgba(0,245,255,.25);}
.npill-faq:hover{background:linear-gradient(135deg,rgba(0,245,255,.3),rgba(139,92,246,.3));box-shadow:0 0 18px rgba(0,245,255,.3);transform:translateY(-1px);}
.npill-scripts{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(244,114,182,.15));color:var(--magenta);border:1px solid rgba(244,114,182,.25);}
.npill-scripts:hover{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(244,114,182,.3));box-shadow:0 0 18px rgba(244,114,182,.35);transform:translateY(-1px);}

/* LANG TOGGLE */
.lang-toggle{display:flex;align-items:center;border:1px solid rgba(0,245,255,.2);border-radius:50px;overflow:hidden;background:rgba(0,0,12,.5);}
.lang-btn{font-family:'Orbitron',sans-serif;font-size:7.5px;letter-spacing:.12em;padding:5px 11px;
  border:none;background:transparent;color:rgba(232,240,255,.3);cursor:none;transition:all .22s;line-height:1;}
.lang-btn.active{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#fff;box-shadow:0 0 10px rgba(0,245,255,.3);}

/* NAV SEARCH + KEYS */
.nav-search{display:flex;align-items:center;gap:.6rem;margin-left:1rem}
.nav-search input[type=search]{width:180px;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:inherit;font-family:'Exo 2',sans-serif}
.keys-badge{font-family:'Orbitron',sans-serif;font-size:9px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid rgba(0,245,255,.06);color:var(--gold);margin-left:.5rem}

section{position:relative;z-index:1;}

/* ── HERO ─────────────────────────────────────────────────────── */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:8rem 2rem 4rem;overflow:hidden;}
.hero-tag{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.5em;text-transform:uppercase;
  color:var(--green);margin-bottom:1.5rem;opacity:0;animation:fadeUp 1s .2s forwards;
  display:flex;align-items:center;gap:.8rem;justify-content:center;
  filter:drop-shadow(0 0 6px rgba(57,255,20,.5));}
.hero-tag::before,.hero-tag::after{content:'';flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--green));}
.hero-tag::after{transform:rotate(180deg);}
.hero-h1{font-family:'Orbitron',sans-serif;font-size:clamp(3rem,11vw,9rem);font-weight:900;line-height:.85;
  background:linear-gradient(135deg,#fff 0%,var(--cyan) 35%,var(--violet) 65%,var(--magenta) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 60px rgba(0,245,255,.3)) drop-shadow(0 0 120px rgba(139,92,246,.2));
  letter-spacing:-.02em;opacity:0;animation:fadeUp 1s .4s forwards;}
.hero-sub{font-size:clamp(.95rem,2vw,1.3rem);font-weight:200;color:rgba(232,240,255,.5);
  margin-top:1.2rem;letter-spacing:.12em;opacity:0;animation:fadeUp 1s .7s forwards;}
.hero-stats{display:flex;gap:3rem;margin-top:3rem;justify-content:center;flex-wrap:wrap;
  opacity:0;animation:fadeUp 1s 1s forwards;}
.hstat{text-align:center;}
.hstat-n{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;
  background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 10px rgba(0,245,255,.4));}
.hstat-l{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,240,255,.35);margin-top:.25rem;}
.hero-cta{display:flex;gap:1.2rem;margin-top:2.5rem;flex-wrap:wrap;justify-content:center;
  opacity:0;animation:fadeUp 1s 1.2s forwards;}
.btn{font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  padding:.9rem 2rem;border-radius:10px;text-decoration:none;cursor:none;border:none;transition:all .3s;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
  opacity:0;transition:opacity .3s;}
.btn:hover::before{opacity:1;}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#fff;
  box-shadow:0 0 30px rgba(0,245,255,.3),0 0 60px rgba(0,245,255,.1);}
.btn-primary:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 50px rgba(0,245,255,.5),0 0 80px rgba(0,245,255,.2);}
.btn-scripts{background:linear-gradient(135deg,var(--violet),var(--magenta));color:#fff;
  box-shadow:0 0 30px rgba(139,92,246,.3);}
.btn-scripts:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 50px rgba(244,114,182,.5);}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.scroll-arrow{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
  font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:.4em;color:rgba(0,245,255,.4);text-transform:uppercase;
  opacity:0;animation:fadeUp 1s 2s forwards,bounceY 2.5s 3s infinite;}
@keyframes bounceY{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),var(--magenta),transparent);opacity:.4;position:relative;z-index:1;box-shadow:0 0 8px rgba(0,245,255,.2);}

/* ── SEC HEADER ───────────────────────────────────────────────── */
.sec-hd{text-align:center;margin-bottom:4rem;}
.sec-tag{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.4em;text-transform:uppercase;
  color:var(--magenta);display:block;margin-bottom:.8rem;filter:drop-shadow(0 0 6px rgba(244,114,182,.4));}
.sec-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:700;
  background:linear-gradient(135deg,#fff,rgba(232,240,255,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ── FAQ ─────────────────────────────────────────────────────── */
#faq{padding:7rem 2rem 8rem;}
.faq-list{max-width:780px;margin:0 auto;display:grid;gap:.75rem;}
.faq-item{border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .3s,transform .3s,box-shadow .3s;}
.faq-item.open{border-color:rgba(0,245,255,.3);transform:scale(1.01);box-shadow:0 0 20px rgba(0,245,255,.08);}
.faq-btn{width:100%;background:rgba(255,255,255,.02);border:none;padding:1.3rem 1.6rem;
  cursor:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  text-align:left;transition:background .3s;}
.faq-btn:hover{background:rgba(0,245,255,.05);}
.faq-qt{font-family:'Exo 2',sans-serif;font-size:.95rem;font-weight:600;color:rgba(232,240,255,.85);}
.faq-icon{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,245,255,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Share Tech Mono',monospace;font-size:1rem;color:var(--cyan);
  transition:transform .35s,background .3s,border-color .3s;}
.faq-item.open .faq-icon{transform:rotate(45deg);background:rgba(0,245,255,.1);border-color:var(--cyan);}
.faq-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.23,1,.32,1);}
.faq-item.open .faq-body{max-height:320px;}
.faq-ans{padding:0 1.6rem 1.4rem;font-size:.875rem;color:rgba(232,240,255,.5);line-height:1.8;font-weight:200;}
.faq-ans code{font-family:'Share Tech Mono',monospace;font-size:.8rem;color:var(--cyan);
  background:rgba(0,245,255,.08);padding:2px 7px;border-radius:4px;}
.faq-ans strong{color:rgba(232,240,255,.75);font-weight:600;}

/* ── MODALS (shared base) ─────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,12,.93);backdrop-filter:blur(24px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s ease;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{width:min(1100px,96vw);height:min(86vh,840px);border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;
  transform:scale(.93) translateY(35px);transition:transform .35s cubic-bezier(.23,1,.32,1);}
.modal-overlay.open .modal-box{transform:scale(1) translateY(0);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.5rem;flex-shrink:0;}
.modal-title{font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:.3em;}
.modal-close{font-family:'Share Tech Mono',monospace;font-size:1.1rem;color:rgba(232,240,255,.4);
  background:none;border:none;cursor:none;padding:4px 9px;border-radius:8px;transition:all .2s;line-height:1;}
.modal-close:hover{color:var(--magenta);background:rgba(244,114,182,.12);}

/* Scripts iframe modal */
#scriptsModal .modal-box{border:1px solid rgba(244,114,182,.35);background:rgba(0,0,12,.97);
  box-shadow:0 0 60px rgba(139,92,246,.15),0 0 120px rgba(0,0,12,.8);}
#scriptsModal .modal-head{border-bottom:1px solid rgba(139,92,246,.2);background:rgba(0,0,12,.7);}
#scriptsModal .modal-title{background:linear-gradient(135deg,var(--violet),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.modal-frame{flex:1;border:none;width:100%;background:#00000c;}

/* Ftap Cracks modal */
#ftapModal .modal-box{border:1px solid rgba(57,255,20,.3);background:rgba(0,0,12,.97);
  box-shadow:0 0 60px rgba(57,255,20,.08),0 0 120px rgba(0,0,12,.8);}
#ftapModal .modal-head{border-bottom:1px solid rgba(57,255,20,.15);background:rgba(0,0,12,.7);}
#ftapModal .modal-title{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* Ftap content area */
.ftap-body{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;}

/* Scripts grid */
.scripts-grid{flex:1;overflow-y:auto;padding:1.4rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;align-content:start;}
.scripts-grid::-webkit-scrollbar{width:4px;}
.scripts-grid::-webkit-scrollbar-thumb{background:rgba(0,245,255,.2);border-radius:4px;}

/* Script tile */
.script-tile{background:rgba(0,245,255,.03);border:1px solid rgba(0,245,255,.1);border-radius:12px;
  padding:1rem;display:flex;flex-direction:column;gap:.75rem;
  transition:border-color .25s,transform .25s,box-shadow .25s;position:relative;overflow:hidden;}
.script-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,245,255,.3),transparent);opacity:0;transition:opacity .25s;}
.script-tile:hover{border-color:rgba(0,245,255,.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,245,255,.08);}
.script-tile:hover::before{opacity:1;}
.tile-icon{font-size:1.5rem;filter:drop-shadow(0 0 6px rgba(0,245,255,.4));}
.tile-name{font-family:'Share Tech Mono',monospace;font-size:.8rem;color:rgba(232,240,255,.85);word-break:break-all;line-height:1.4;}
.tile-ext{font-size:.65rem;color:rgba(0,245,255,.5);font-family:'Share Tech Mono',monospace;margin-top:.2rem;}
.tile-actions{display:flex;gap:.5rem;justify-content:space-between;margin-top:auto;}
.tile-btn{font-family:'Orbitron',sans-serif;font-size:6.5px;letter-spacing:.15em;text-transform:uppercase;
  padding:5px 10px;border-radius:6px;border:none;cursor:none;transition:all .2s;flex:1;text-align:center;}
.tile-btn-view{background:rgba(139,92,246,.15);color:var(--violet);border:1px solid rgba(139,92,246,.25);}
.tile-btn-view:hover{background:rgba(139,92,246,.3);box-shadow:0 0 12px rgba(139,92,246,.3);}
.tile-btn-copy{background:rgba(0,245,255,.1);color:var(--cyan);border:1px solid rgba(0,245,255,.2);}
.tile-btn-copy:hover{background:rgba(0,245,255,.25);box-shadow:0 0 12px rgba(0,245,255,.3);}
.tile-btn-copy.copied{background:rgba(57,255,20,.15);color:var(--green);border-color:rgba(57,255,20,.3);}

/* Script viewer panel */
.script-viewer{position:absolute;inset:0;background:rgba(0,0,12,.97);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.23,1,.32,1);z-index:10;}
.script-viewer.visible{transform:translateX(0);}
.sv-head{display:flex;align-items:center;gap:1rem;padding:.9rem 1.4rem;
  border-bottom:1px solid rgba(0,245,255,.1);flex-shrink:0;}
.sv-back{font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:.2em;
  background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.2);color:var(--cyan);
  padding:5px 12px;border-radius:6px;cursor:none;transition:all .2s;}
.sv-back:hover{background:rgba(0,245,255,.2);}
.sv-title{font-family:'Share Tech Mono',monospace;font-size:.8rem;color:rgba(232,240,255,.6);}
.sv-copy-btn{margin-left:auto;font-family:'Orbitron',sans-serif;font-size:6.5px;letter-spacing:.15em;
  background:rgba(0,245,255,.1);border:1px solid rgba(0,245,255,.2);color:var(--cyan);
  padding:5px 12px;border-radius:6px;cursor:none;transition:all .2s;}
.sv-copy-btn:hover{background:rgba(0,245,255,.25);}
.sv-code{flex:1;overflow-y:auto;padding:1.4rem;font-family:'Share Tech Mono',monospace;
  font-size:.75rem;line-height:1.7;color:rgba(0,245,255,.8);white-space:pre-wrap;word-break:break-all;}
.sv-code::-webkit-scrollbar{width:4px;}
.sv-code::-webkit-scrollbar-thumb{background:rgba(0,245,255,.2);border-radius:4px;}

/* Loading state */
.ftap-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;flex:1;}
.ftap-spinner{width:44px;height:44px;border:2px solid rgba(57,255,20,.15);border-top-color:var(--green);
  border-radius:50%;animation:spin .7s linear infinite;}
.ftap-load-txt{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:.3em;color:rgba(57,255,20,.4);}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error state */
.ftap-error{text-align:center;padding:3rem;font-family:'Share Tech Mono',monospace;font-size:.8rem;color:rgba(244,114,182,.6);}

/* THEMES + SHOP + PROMO MODALS */
.modal-small .modal-box{width:min(700px,92vw);height:auto}
.theme-list{display:flex;gap:.6rem;padding:1rem;flex-wrap:wrap}
.theme-card{padding:.8rem 1rem;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border);cursor:pointer}
.shop-grid{display:grid;grid-template-columns:1fr;gap:1rem;padding:1rem}
.promo-body{padding:1.2rem;display:flex;flex-direction:column;gap:.6rem}
.promo-input{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:inherit}

/* ── FOOTER ───────────────────────────────────────────────────── */
footer{padding:3.5rem 2rem;text-align:center;border-top:1px solid var(--border);z-index:1;position:relative;}
.f-logo{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900;letter-spacing:.4em;
  background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 10px rgba(0,245,255,.3));}
.f-warn{font-size:.72rem;color:rgba(232,240,255,.2);margin-top:1.2rem;line-height:1.7;letter-spacing:.05em;}

@media(max-width:700px){
  nav{padding:.8rem 1rem;gap:.5rem;}
  .nav-links{display:none;}
  .npill{padding:4px 9px;font-size:6.5px;}
  .lang-btn{padding:4px 8px;}
  .modal-box{height:91vh;}
  .scripts-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
}
</style>
</head>
<body>

<div id="cur"></div>

let currentLang='ru';
function setLang(lang){
  currentLang=lang;
  document.getElementById('btn-ru').classList.toggle('active',lang==='ru');
  document.getElementById('btn-en').classList.toggle('active',lang==='en');
  const t=i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!=null)el.textContent=t[k];});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const k=el.getAttribute('data-i18n-html');if(t[k]!=null)el.innerHTML=t[k];});
  document.documentElement.lang=lang;
}

function applyTheme(id){const t=THEMES.find(x=>x.id===id)||THEMES[0];Object.keys(t.vars||{}).forEach(k=>document.documentElement.style.setProperty(k,t.vars[k]));localStorage.setItem(STORAGE_THEME,id);document.getElementById('curTheme').textContent=t.label;closeThemes();}

async function fetchText(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}

let shopPreviewContent='';
async function previewShopScript(){const g=document.getElementById('shopGrid');g.innerHTML='<div class="ftap-loading"><div class="ftap-spinner"></div><div class="ftap-load-txt">LOADING...</div></div>';

async function buyShopItem(btn){if(keysCount<SHOP_ITEM.price){alert('Not enough keys');return;}try{const txt=await fetchText(SHOP_ITEM.url);keysCount-=SHOP_ITEM.price;localStorage.setItem(STORAGE_KEYS,String(keysCount));purchases.push(SHOP_ITEM.url);localStorage.setItem(STORAGE_PURCHASES,JSON.stringify(purchases));updateKeysBadge();populateShop();alert('Purchased!');}catch(e){alert('Purchase failed: '+e.message);} }

async function viewShopScript(){if(!purchases.includes(SHOP_ITEM.url))return alert('Not purchased');const txt=await fetchText(SHOP_ITEM.url);const g=document.getElementById('shopGrid');g.innerHTML=`<pre style="white-space:pre-wrap;padding:1rem;background:rgba(0,0,0,.5);">${escHtml(txt)}</pre><div style="display:flex;gap:.5rem;margin-top:.6rem"><button class="tile-btn tile-btn-copy" onclick="copyTextFromString()">Copy</button></div>`}

function copyTextFromString(){navigator.clipboard.writeText(shopPreviewContent).catch(()=>{});alert('Copied');}

function copyText(url){fetchText(url).then(t=>{navigator.clipboard.writeText(t).catch(()=>{});alert('Copied');}).catch(e=>alert('Failed'))}

async function scanPromo(){document.getElementById('promoStatus').textContent='Scanning remote...';try{const txt=await fetchText(PROMO_RAW_URL);const matches=[...txt.matchAll(/([A-Za-z0-9-_]+)\s*--\s*(\d+)/g)];promoCodesMap={};matches.forEach(m=>promoCodesMap[m[1]]=parseInt(m[2],10));document.getElementById('promoStatus').textContent='Found: '+Object.keys(promoCodesMap).join(', ');}catch(e){document.getElementById('promoStatus').textContent='Scan failed: '+e.message}}

function openPromo(){document.getElementById('promoModal').classList.add('open');document.body.style.overflow='hidden';document.getElementById('promoStatus').textContent='';}
function closePromo(){document.getElementById('promoModal').classList.remove('open');document.body.style.overflow='';}

function redeemPromo(){const code=document.getElementById('promoInput').value.trim();if(!code)return; if(redeemed.includes(code)){document.getElementById('promoStatus').textContent='Code already used';return;} let v=promoCodesMap[code]; if(!v){document.getElementById('promoStatus').textContent='Code not found in scanned list — trying exact match via remote...';
  // attempt remote fetch for single code
  fetch(PROMO_RAW_URL).then(r=>r.text()).then(t=>{const m=new RegExp(code+"\\s*--\\s*(\\d+)").exec(t);if(m){v=parseInt(m[1],10);applyPromo(code,v);}else document.getElementById('promoStatus').textContent='Code not found';}).catch(e=>document.getElementById('promoStatus').textContent='Failed: '+e.message);return;} applyPromo(code,v);}

function applyPromo(code,v){keysCount+=v;localStorage.setItem(STORAGE_KEYS,String(keysCount));redeemed.push(code);localStorage.setItem(STORAGE_REDEEMED,JSON.stringify(redeemed));updateKeysBadge();document.getElementById('promoStatus').textContent=`Redeemed ${code} → +${v} keys`;}

function performSearch(q){q=q.trim().toLowerCase();if(!q)return;const faq=Array.from(document.querySelectorAll('.faq-qt'));const match=faq.find(el=>el.textContent.toLowerCase().includes(q));if(match){match.scrollIntoView({behavior:'smooth',block:'center'});match.closest('.faq-item').classList.add('open');document.querySelectorAll('.faq-item').forEach(f=>{if(f!==match.closest('.faq-item'))f.classList.remove('open')});return;}const tiles=Array.from(document.querySelectorAll('.tile-name'));const tmatch=tiles.find(el=>el.textContent.toLowerCase().includes(q));if(tmatch){tmatch.scrollIntoView({behavior:'smooth',block:'center'});return;}alert('No results');}

    const r=await fetch(API_URL);
    if(!r.ok)throw new Error('GitHub API error: '+r.status);
    const files=await r.json();
    const fileList=files.filter(f=>f.type==='file');
    if(!fileList.length){grid.innerHTML='<div class="ftap-error">No files found.</div>';return;}
    grid.innerHTML='';
    fileList.forEach(f=>{
      const ext=f.name.includes('.')?f.name.split('.').pop():'file';
      const icon=ext==='luau'||ext==='lua'?'📜':ext==='txt'?'📄':'📦';
      const rawUrl=f.download_url||`${RAW_BASE}${encodeURIComponent(f.name)}`;
      const tile=document.createElement('div');
      tile.className='script-tile';
      tile.innerHTML=`
        <div class="tile-icon">${icon}</div>
        <div>
          <div class="tile-name">${escHtml(f.name)}</div>
          <div class="tile-ext">.${ext} &nbsp;·&nbsp; raw</div>
        </div>
        <div class="tile-actions">
          <button class="tile-btn tile-btn-view" onclick="viewScript('${rawUrl}','${escHtml(f.name)}')" data-i18n="btn_view">Script View</button>
          <button class="tile-btn tile-btn-copy" onclick="copyScript(this,'${rawUrl}')" data-i18n="btn_copy">Copy</button>
        </div>`;
      grid.appendChild(tile);
    });
  }catch(e){
    grid.innerHTML=`<div class="ftap-error">⚠ Failed to load: ${escHtml(e.message)}<br><br>Check network / GitHub API rate limit.</div>`;
  }
}

async function viewScript(url,name){
  const viewer=document.getElementById('scriptViewer');
  const code=document.getElementById('svCode');
  const title=document.getElementById('svTitle');
  title.textContent=name;
  code.textContent='Loading...';
  viewedContent='';
  viewer.classList.add('visible');
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    viewedContent=text;
    code.textContent=text;
  }catch(e){code.textContent='Error loading script: '+e.message;}
}

function closeViewer(){document.getElementById('scriptViewer').classList.remove('visible');}

async function copyViewed(){
  if(!viewedContent)return;
  await navigator.clipboard.writeText(viewedContent).catch(()=>{});
  const btn=document.getElementById('svCopyBtn');
  const orig=btn.textContent;btn.textContent='✓ Copied!';
  setTimeout(()=>btn.textContent=orig,2000);
}

async function copyScript(btn,url){
  try{
    const r=await fetch(url);
    const text=await r.text();
    await navigator.clipboard.writeText(text);
    btn.textContent='✓ Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},2200);
  }catch(e){btn.textContent='Error';setTimeout(()=>btn.textContent='Copy',2000);}
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── CLOSE ON ESC ─────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeScriptsModal();closeFtap();closeViewer();}
});

// ── CURSOR ───────────────────────────────────────────────────────
const cur=document.getElementById('cur'),curR=document.getElementById('cur-r');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function loop(){
  rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
  cur.style.left=mx+'px';cur.style.top=my+'px';
  curR.style.left=rx+'px';curR.style.top=ry+'px';
  requestAnimationFrame(loop);
})();

// ── STARFIELD ────────────────────────────────────────────────────
const cv=document.getElementById('bg'),cx=cv.getContext('2d');
let W,H;
function rsz(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
rsz();window.addEventListener('resize',rsz);

// multi-layer stars
const stars=Array.from({length:350},()=>({
  x:Math.random()*99999%99999,y:Math.random()*99999%99999,
  r:Math.random()*1.6+.15,a:Math.random(),
  da:(Math.random()-.5)*.01,
  c:[
    '#ffffff','#ffffff','#ffffff',
    '#88ccff','#aaddff',
    '#ffddaa','#ffccbb',
    '#00f5ff','#8b5cf6'
  ][Math.floor(Math.random()*9)],
  speed:Math.random()*.3+.05
}));

// cosmic particles (larger glowing blobs)
const blobs=Array.from({length:18},()=>({
  x:Math.random(),y:Math.random(),
  r:Math.random()*3+1.5,a:Math.random()*.4,
  da:(Math.random()-.5)*.005,
  c:['#00f5ff','#8b5cf6','#f472b6','#39ff14'][Math.floor(Math.random()*4)]
}));

let frame=0;
function drawStars(){
  frame++;
  cv.width=W; // clears canvas
  // draw blobs
  blobs.forEach(b=>{
    b.a+=b.da;if(b.a<0||b.a>.4)b.da*=-1;b.a=Math.max(0,Math.min(.4,b.a));
    cx.save();cx.globalAlpha=b.a;
    cx.shadowBlur=20;cx.shadowColor=b.c;
    cx.fillStyle=b.c;
    cx.beginPath();cx.arc(b.x*W,b.y*H,b.r,0,Math.PI*2);cx.fill();
    cx.restore();
  });
  // draw stars
  stars.forEach(s=>{
    s.x=(s.x+s.speed)%W;
    s.a+=s.da;if(s.a<0||s.a>1)s.da*=-1;s.a=Math.max(0,Math.min(1,s.a));
    cx.save();cx.globalAlpha=s.a*.9;cx.fillStyle=s.c;
    if(s.r>1){cx.shadowBlur=8;cx.shadowColor=s.c;}
    cx.beginPath();cx.arc(s.x,s.y%H,s.r,0,Math.PI*2);cx.fill();
    cx.restore();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

// ── SHOOTING STARS ───────────────────────────────────────────────
function shoot(){
  const el=document.createElement('div');
  const x=Math.random()*W, y=Math.random()*H*.4;
  const len=120+Math.random()*200;
  el.style.cssText=`position:fixed;width:${len}px;height:1px;pointer-events:none;z-index:0;
    left:${x}px;top:${y}px;transform-origin:left center;transform:rotate(25deg);
    background:linear-gradient(90deg,transparent,rgba(0,245,255,.8),white,transparent);`;
  document.body.appendChild(el);
  const dur=400+Math.random()*300;
  el.animate([{opacity:0,transform:'rotate(25deg) translateX(-20px)'},{opacity:1,offset:.1},{opacity:0,transform:`rotate(25deg) translateX(${len*1.5}px)`}],
    {duration:dur,easing:'ease-out'}).onfinish=()=>el.remove();
}
setInterval(shoot,2200);

// ── FAQ TOGGLE ───────────────────────────────────────────────────
function tog(btn){
  const item=btn.closest('.faq-item'),isOpen=item.classList.contains('open');
  document.querySelectorAll('.faq-item').forEach(f=>f.classList.remove('open'));
  if(!isOpen)item.classList.add('open');
}

// ── SCROLL11 REVEAL ────────────────────────────────────────────────
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.style.opacity='1';e.target.style.transform='translateY(0) scale(1)';}});
},{threshold:.08});
document.querySelectorAll('.faq-item').forEach((el,i)=>{
  el.style.opacity='0';el.style.transform='translateY(30px) scale(0.98)';
  el.style.transition=`opacity .6s ${i*.06}s cubic-bezier(.23,1,.32,1),transform .6s ${i*.06}s cubic-bezier(.23,1,.32,1)`;
  obs.observe(el);
});
</script>
